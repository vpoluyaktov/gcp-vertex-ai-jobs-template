name: ci

# Lint + validate on every push / PR. Runs before deploy-stage / deploy-prod.
on:
  push:
    branches: [main, stage]
  pull_request:

permissions:
  contents: read

jobs:
  terraform-validate:
    name: terraform fmt + validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.6.6"

      - name: terraform fmt -check
        run: terraform -chdir=terraform fmt -check -recursive

      # Validate the single root module. -backend=false skips backend init so
      # no GCP creds are needed. The env-specific backend.tf files (in stage/
      # and prod/) are pure HCL declarations — they're covered by fmt -check.
      - name: terraform init (no backend)
        run: terraform -chdir=terraform init -backend=false -input=false

      - name: terraform validate
        run: terraform -chdir=terraform validate

  python-lint:
    name: python lint + test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # TODO(backend/qa): wire up setup-python + ruff + pytest once the Python
      # source tree is populated. Keeping this as a placeholder so the workflow
      # graph stays accurate.
      - name: Placeholder
        run: echo "Python lint + tests will land once source files exist."
