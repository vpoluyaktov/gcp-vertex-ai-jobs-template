name: deploy-prod

# Mirrors the per-env separation from gcp-cloudrun-template and
# gcp-clouddeploy-gke-template — single root module + env-specific backend.tf
# copied in at CI time + env-specific tfvars passed via -var-file.
on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-prod
  cancel-in-progress: false

env:
  TF_VERSION: "1.6.6"
  GCP_PROJECT_ID: dfh-prod-id
  TF_STATE_BUCKET: dfh-prod-tfstate

permissions:
  contents: read
  id-token: write

jobs:
  deploy:
    name: terraform apply (prod)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # The workflow file is env-specific, so a single auth step is safe.
      # The conditional-auth pattern from gcp-clouddeploy-gke-template only
      # exists to dodge the `${{ A && B || C }}` ternary fall-through bug —
      # not applicable here.
      - name: Authenticate to Google Cloud (production)
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_PROD_SA_KEY }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2
        with:
          project_id: ${{ env.GCP_PROJECT_ID }}

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      # Pre-flight: fail fast (today, log-only) if a resource Terraform expects
      # to create already exists outside its state. Per template-standards.md §4.
      - name: Pre-deploy resource conflict check
        run: |
          echo "Checking for pre-existing resources in ${GCP_PROJECT_ID}..."
          gcloud firestore databases list --project="${GCP_PROJECT_ID}" --format="value(name)" || true
          gcloud run services list --project="${GCP_PROJECT_ID}" --format="value(metadata.name)" || true
          gsutil ls -p "${GCP_PROJECT_ID}" 2>/dev/null || true
          # TODO(devops): once modules are wired, fail this step on a real conflict.

      # The single root lives at terraform/. CI copies the env-specific
      # backend.tf in before init so the state goes to the right bucket.
      - name: Stage backend config
        run: cp terraform/prod/backend.tf terraform/backend.tf

      - name: Terraform fmt -check
        run: terraform -chdir=terraform fmt -check -recursive

      - name: Terraform init
        run: terraform -chdir=terraform init -input=false

      - name: Terraform validate
        run: terraform -chdir=terraform validate

      - name: Terraform plan
        run: terraform -chdir=terraform plan -input=false -var-file=prod/prod.tfvars -out=tfplan

      - name: Terraform apply
        run: terraform -chdir=terraform apply -input=false -auto-approve tfplan

      # TODO(devops): once modules land, follow with build/push images and
      # deploy the Temporal worker. Pattern mirrors gcp-cloudrun-template
      # (gcr.io build → push → Cloud Run service update).

      - name: Summary
        if: always()
        run: |
          echo "[prod] Deployment job status: ${{ job.status }}"
          echo "[prod] Project: ${GCP_PROJECT_ID}"
          echo "[prod] State:   gs://${TF_STATE_BUCKET}/gcp-vertex-ai-jobs-template/state"
