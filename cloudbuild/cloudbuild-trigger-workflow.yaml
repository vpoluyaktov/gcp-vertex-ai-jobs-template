###############################################################################
# Cloud Build — trigger a Temporal workflow from CI.
#
# Used by deploy-stage.yml after `terraform apply` succeeds, per ARCHITECTURE.md
# §9.3: "smoke-submit a `debug` workflow". Also usable for production cutover
# tests by manual invocation with _JOB_CONFIG_URI set to a real job YAML.
#
# This config is NOT an image build — it's a one-shot job-submitter using
# the Temporal Python client. It runs INSIDE the env's VPC by attaching to
# the Serverless VPC Access Connector so it can reach the Temporal server's
# INTERNAL ingress.
#
# Substitutions:
#   _ENV               : stage or prod
#   _REGION            : Cloud Build / VPC region (us-central1)
#   _VPC_CONNECTOR     : name of the Serverless VPC Access Connector (output
#                        of the networking module: `vpcconn-<env>`)
#   _TEMPORAL_ADDRESS  : VPC-internal address of the Temporal server, e.g.
#                        temporal-server.stage.internal:443 (gRPC over TLS;
#                        Cloud Run terminates TLS at the edge — see DevOps
#                        note in terraform/modules/temporal_server/main.tf)
#   _TEMPORAL_NAMESPACE: "default"
#   _TEMPORAL_TASK_QUEUE: "vertex-finetune-<env>"
#   _JOB_CONFIG_URI    : gs:// URI of the job YAML to submit. Defaults to the
#                        bundled debug job (configs/jobs/debug.yaml mirrored
#                        to gs://<project>-configs/debug.yaml at deploy time).
#   _WORKFLOW_TIMEOUT_S: client-side wait timeout in seconds (300 = 5 min;
#                        we don't wait for the whole workflow — just confirm
#                        it accepted)
###############################################################################

substitutions:
  _ENV: stage
  _REGION: us-central1
  _VPC_CONNECTOR: vpcconn-${_ENV}
  _TEMPORAL_ADDRESS: temporal-server.${_ENV}.internal:443
  _TEMPORAL_NAMESPACE: default
  _TEMPORAL_TASK_QUEUE: vertex-finetune-${_ENV}
  _JOB_CONFIG_URI: gs://${PROJECT_ID}-configs/debug.yaml
  _WORKFLOW_TIMEOUT_S: "300"

steps:
  # Build a thin job-submitter image on the fly. Keeping it inline (no
  # registry pull) means this YAML is self-contained and won't break if the
  # worker image isn't pushed yet (chicken-and-egg during first deploy).
  - id: build-submitter
    name: gcr.io/cloud-builders/docker
    entrypoint: bash
    args:
      - -c
      - |
        set -euo pipefail
        cat > /workspace/Dockerfile.submit <<'EOF'
        FROM python:3.11-slim
        RUN pip install --no-cache-dir \
            temporalio>=1.7.0 \
            google-cloud-storage>=2.16.0 \
            PyYAML>=6.0
        COPY temporal/ /app/temporal/
        WORKDIR /app
        ENV PYTHONPATH=/app
        EOF
        docker build -f /workspace/Dockerfile.submit -t submitter:local .

  # Submit a job via the worker's submit_job.py client (§12.6.3). The actual
  # Temporal workflow runs on the worker Cloud Run Job — this step just sends
  # the start signal and returns when Temporal has accepted the run.
  - id: submit-workflow
    name: submitter:local
    entrypoint: bash
    env:
      - TEMPORAL_ADDRESS=${_TEMPORAL_ADDRESS}
      - TEMPORAL_NAMESPACE=${_TEMPORAL_NAMESPACE}
      - TEMPORAL_TASK_QUEUE=${_TEMPORAL_TASK_QUEUE}
      - JOB_CONFIG_URI=${_JOB_CONFIG_URI}
      - WORKFLOW_TIMEOUT_S=${_WORKFLOW_TIMEOUT_S}
    args:
      - -c
      - |
        set -euo pipefail
        echo "Submitting workflow against $$TEMPORAL_ADDRESS (namespace=$$TEMPORAL_NAMESPACE)"
        if [ -f /app/temporal/submit_job.py ]; then
          python /app/temporal/submit_job.py \
            --job-config="$$JOB_CONFIG_URI" \
            --wait-seconds=$$WORKFLOW_TIMEOUT_S
        else
          # Fallback when submit_job.py hasn't landed yet (early-deploy guard).
          python - <<'PY'
        import asyncio, os, sys, uuid
        from temporalio.client import Client
        async def main():
            client = await Client.connect(
                os.environ["TEMPORAL_ADDRESS"],
                namespace=os.environ["TEMPORAL_NAMESPACE"],
            )
            wf_id = f"smoke-{uuid.uuid4().hex[:8]}"
            print(f"Connected. Would submit workflow id={wf_id} task_queue={os.environ['TEMPORAL_TASK_QUEUE']}")
            print("submit_job.py not yet present — connection-only smoke test passed.")
        asyncio.run(main())
        PY
        fi

# Egress through the VPC connector so the build step can reach the Temporal
# server's INTERNAL ingress address.
options:
  machineType: E2_STANDARD_2
  logging: CLOUD_LOGGING_ONLY
  dynamicSubstitutions: true
  pool:
    name: ""
  # NOTE: Standard Cloud Build workers don't sit in a customer VPC by default.
  # When the team-lead promotes this to a real Private Pool, replace
  # `pool.name` above with the worker pool resource name (e.g.
  # projects/<proj>/locations/us-central1/workerPools/cloudbuild-<env>) and
  # remove this NOTE.

timeout: 600s

serviceAccount: projects/${PROJECT_ID}/serviceAccounts/cloudbuild-${_ENV}@${PROJECT_ID}.iam.gserviceaccount.com
